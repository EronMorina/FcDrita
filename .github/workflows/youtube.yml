name: Update YouTube videos

on:
  schedule:
    - cron: "17 * * * *" # hourly
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-commits
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-youtube.mjs
      - name: Commit if the video list changed
        run: |
          if git diff --quiet -- youtube.json; then
            echo "No new videos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add youtube.json
          git commit -m "Update YouTube videos"
          git pull --rebase
          git push
